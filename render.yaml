# render.yaml - Headless Microservice Engine Infrastructure Blueprint
services:
  # The Decoupled Asynchronous API Backend Node
  - type: web
    name: finrisk-backend-api
    env: python
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
