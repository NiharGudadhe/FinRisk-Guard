# .github/workflows/ci-cd-pipeline.yml
name: FinRisk Guard CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Phase 1: Quality Assurance & Code Integration Checks
  continuous-integration:
    runs-on: ubuntu-latest
    
    steps:
    - name: Access Source Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        python -m spacy download en_core_web_sm

    - name: Execute Automated Unit Testing Suites
      run: |
        # Pytest checks API liveness, text classification boundaries, and database query processing
        python -m pytest

  # Phase 2: Production Continuous Deployment (Triggered only if CI passes)
  continuous-deployment:
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy Live Service Instance to Render Gateway
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }} # Enforced encrypted token from your GitHub repository secrets
        api-key: ${{ secrets.RENDER_API_KEY }}
